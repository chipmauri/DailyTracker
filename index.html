  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

          <span style=\"font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1.8px;text-transform:uppercase;min-height:26px;color:#8a8078\">Fast hours<\u002Fspan>\n          <span style=\"font-family:'DM Mono',monospace;font-size:26px;color:#fff\">{{ draftHours }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:5px\">\n          <span style=\"font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1.8px;text-transform:uppercase;min-height:26px;color:#8a8078\">Calories from protein<\u002Fspan>\n          <span style=\"font-family:'DM Mono',monospace;font-size:26px;color:#fff\">{{ draftProPct }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:20px\">\n    <div style=\"border:1px solid #2e2a26;border-radius:10px;padding:clamp(18px,2.4vw,26px) clamp(18px,2.6vw,28px) 28px;display:flex;flex-direction:column;gap:22px\">\n      <div style=\"display:flex;flex-direction:column;gap:14px\">\n        <span style=\"font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#8a8078\">Running calorie average<\u002Fspan>\n        <div style=\"display:flex;align-items:baseline;gap:14px\">\n          <span style=\"font-family:'DM Mono',monospace;font-size:clamp(42px,8vw,64px);line-height:.9;color:{{ avgColor }}\">{{ avgCalStr }}<\u002Fspan>\n          <span style=\"font-family:'DM Mono',monospace;font-size:15px;color:#8a8078\">/ {{ goalStr }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"height:6px;border-radius:3px;background:#272320;overflow:hidden\">\n          <div style=\"height:100%;border-radius:3px;background:{{ avgColor }};width:{{ avgPct }}\"><\u002Fdiv>\n        <\u002Fdiv>\n        <span style=\"font-size:14px;color:#c8bfb4\">{{ avgVerdict }}<\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;border-top:1px solid #2e2a26;padding-top:22px\">\n        <div style=\"display:flex;flex-direction:column;gap:6px\">\n          <span style=\"font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1.6px;text-transform:uppercase;min-height:26px;color:#8a8078\">Protein avg<\u002Fspan>\n          <span style=\"font-family:'DM Mono',monospace;font-size:24px;color:#fff\">{{ avgProStr }}<\u002Fspan>\n          <span style=\"font-family:'DM Mono',monospace;font-size:12px;color:{{ proColor }}\">{{ proDelta }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px\">\n          <span style=\"font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1.6px;text-transform:uppercase;min-height:26px;color:#8a8078\">Fast avg<\u002Fspan>\n          <span style=\"font-family:'DM Mono',monospace;font-size:24px;color:#fff\">{{ avgFastStr }}<\u002Fspan>\n          <span style=\"font-family:'DM Mono',monospace;font-size:12px;color:#8a8078\">hours<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px\">\n          <span style=\"font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1.6px;text-transform:uppercase;min-height:26px;color:#8a8078\">Days logged<\u002Fspan>\n          <span style=\"font-family:'DM Mono',monospace;font-size:24px;color:#fff\">{{ loggedStr }}<\u002Fspan>\n          <span style=\"font-family:'DM Mono',monospace;font-size:12px;color:#8a8078\">counted in avg<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n    <sc-if value=\"{{ showPace }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"border:1px solid #e8622a;border-radius:10px;background:#221a15;padding:22px 26px 24px;display:flex;flex-direction:column;gap:14px\">\n        <span style=\"font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#e8622a\">{{ paceTitle }}<\u002Fspan>\n        <div style=\"display:flex;align-items:baseline;gap:12px\">\n          <span style=\"font-family:'DM Mono',monospace;font-size:clamp(34px,7vw,48px);line-height:.9;color:{{ paceColor }}\">{{ paceValue }}<\u002Fspan>\n          <span style=\"font-family:'DM Mono',monospace;font-size:14px;color:#c8bfb4\">{{ paceUnit }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"display:flex;flex-direction:column;gap:16px\">\n    <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:16px;border-bottom:1px solid #2e2a26;padding-bottom:12px\">\n      <h2 style=\"font-size:17px;font-weight:600;color:#f0ebe4\">This week<\u002Fh2>\n      <span style=\"font-family:'DM Mono',monospace;font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:#8a8078\">Click a day to edit it<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,116px),1fr));gap:12px\">\n      <sc-for list=\"{{ days }}\" as=\"d\" hint-placeholder-count=\"6\">\n        <div sc-camel-on-click=\"{{ d.select }}\" style=\"border:1px solid {{ d.border }};border-radius:9px;background:{{ d.bg }};padding:16px 16px 18px;display:flex;flex-direction:column;gap:14px;min-height:172px;cursor:pointer\" style-hover=\"border-color:#8a8078\">\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:8px\">\n            <span style=\"font-family:'DM Mono',monospace;font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:{{ d.nameColor }}\">{{ d.name }}<\u002Fspan>\n            <span style=\"font-family:'DM Mono',monospace;font-size:11px;color:#8a8078\">{{ d.date }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:3px\">\n            <span style=\"font-family:'DM Mono',monospace;font-size:27px;line-height:1;color:{{ d.calColor }}\">{{ d.cal }}<\u002Fspan>\n            <span style=\"font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:#8a8078\">{{ d.calNote }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"margin-top:auto;display:flex;flex-direction:column;gap:6px;font-family:'DM Mono',monospace;font-size:12px;color:#c8bfb4\">\n            <div style=\"display:flex;justify-content:space-between;gap:8px\"><span style=\"color:#8a8078\">PRO<\u002Fspan><span>{{ d.pro }}<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;gap:8px\"><span style=\"color:#8a8078\">FAST<\u002Fspan><span>{{ d.fast }}<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <sc-if value=\"{{ hasHistory }}\" hint-placeholder-val=\"{{ true }}\">\n    <section style=\"display:flex;flex-direction:column;gap:16px\">\n      <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:16px;border-bottom:1px solid #2e2a26;padding-bottom:12px\">\n        <h2 style=\"font-size:17px;font-weight:600;color:#f0ebe4\">Prior weeks<\u002Fh2>\n        <span style=\"font-family:'DM Mono',monospace;font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:#8a8078\">Average vs goal<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;overflow-x:auto;min-width:0\">\n        <div style=\"display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr 1fr 0.9fr;gap:16px;min-width:520px;padding:0 4px 10px;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:#8a8078\">\n          <span>Week<\u002Fspan><span>Goal<\u002Fspan><span>Cal avg<\u002Fspan><span>Protein avg<\u002Fspan><span>Fast avg<\u002Fspan><span>Days<\u002Fspan>\n        <\u002Fdiv>\n        <sc-for list=\"{{ history }}\" as=\"w\" hint-placeholder-count=\"4\">\n          <div style=\"display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr 1fr 0.9fr;gap:16px;min-width:520px;padding:14px 4px;border-top:1px solid #2e2a26;font-family:'DM Mono',monospace;font-size:14px;color:#c8bfb4;align-items:center\">\n            <span style=\"color:#f0ebe4\">{{ w.label }}<\u002Fspan>\n            <span>{{ w.goal }}<\u002Fspan>\n            <span style=\"color:{{ w.color }}\">{{ w.cal }}<\u002Fspan>\n            <span>{{ w.pro }}<\u002Fspan>\n            <span>{{ w.fast }}<\u002Fspan>\n            <span>{{ w.days }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;calorieGoal&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:2400,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:1500,&quot;max&quot;:4000,&quot;step&quot;:25,&quot;section&quot;:&quot;Weekly goals&quot;},&quot;proteinGoal&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:190,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:80,&quot;max&quot;:320,&quot;step&quot;:5,&quot;section&quot;:&quot;Weekly goals&quot;}}\">\nconst SUPABASE_URL = 'https://atcfayeeeqdwpdeqwxuf.supabase.co';\nconst SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF0Y2ZheWVlZXFkd3BkZXF3eHVmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4NTMwMDAsImV4cCI6MjEwNTQyOTAwMH0.MT1DPD-5oGVysxikOK72hZEv_Q8b3bjt6-VI3AWvMKA';\n\nconst DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday'];\nconst GREEN = '#4ecb7a', RED = '#f05555', ORANGE = '#e8622a', DIM = '#8a8078';\nconst MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];\n\nfunction range(a, b, step, fmt) {\n  const out = [];\n  for (let v = a; v <= b; v += step) out.push({ v: String(v), l: fmt(v) });\n  return out;\n}\nfunction clock(mins) {\n  let h = Math.floor(mins / 60) % 24, m = mins % 60;\n  const ap = h >= 12 ? 'pm' : 'am';\n  let hh = h % 12; if (hh === 0) hh = 12;\n  return hh + ':' + String(m).padStart(2, '0') + ' ' + ap;\n}\nfunction iso(d) {\n  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');\n}\nfunction addDays(d, n) { const x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }\nfunction parseISO(s) { const p = s.split('-'); return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2])); }\nfunction pretty(d) { return MON[d.getMonth()] + ' ' + d.getDate(); }\nfunction avg(list) { return list.length ? list.reduce((a, v) => a + v, 0) / list.length : null; }\n\nclass Component extends DCLogic {\n  state = {\n    weekStartISO: null,\n    entries: {},          // 0..5 -> {cal, pro, stop, start}\n    satStart: null,\n    goal: null,\n    proteinGoal: null,\n    history: [],\n    idx: 0,\n    draft: { cal: null, pro: null, stop: null, start: null },\n    open: null,\n    saved: false,\n    status: 'connecting'  // connecting | synced | saving | offline\n  };\n\n  componentDidMount() {\n    const now = new Date();\n    const dow = now.getDay();\n    const ws = addDays(now, -(dow === 6 ? 6 : dow));\n    this.weekStart = ws;\n    this.setState({ weekStartISO: iso(ws), idx: dow === 6 ? 5 : dow });\n    this.connect();\n  }\n\n  async connect() {\n    for (let i = 0; i < 40 && !window.supabase; i++) await new Promise(r => setTimeout(r, 100));\n    if (!window.supabase) { this.setState({ status: 'offline' }); return; }\n    this.sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);\n    this.load();\n  }\n\n  async load() {\n    if (!this.sb) return;\n    const from = iso(addDays(this.weekStart, -28));\n    const res = await this.sb.from('days').select('*').gte('day', from).order('day');\n    const wres = await this.sb.from('weeks').select('*').gte('week_start', from);\n    if (res.error || wres.error) { this.setState({ status: 'offline' }); return; }\n\n    this.byDate = {};\n    (res.data || []).forEach(r => { this.byDate[r.day] = r; });\n    this.weekRows = {};\n    (wres.data || []).forEach(r => { this.weekRows[r.week_start] = r; });\n\n    const wsISO = iso(this.weekStart);\n    let week = this.weekRows[wsISO];\n    if (!week) {\n      week = { week_start: wsISO, calorie_goal: 2400, protein_goal: 190, sat_start: null };\n      await this.sb.from('weeks').upsert(week);\n      this.weekRows[wsISO] = week;\n    }\n\n    const entries = {};\n    for (let i = 0; i < 6; i++) {\n      const r = this.byDate[iso(addDays(this.weekStart, i))];\n      if (r) entries[i] = { cal: r.calories, pro: r.protein, stop: r.fast_stop, start: r.fast_start };\n    }\n\n    this.setState(s => ({\n      entries,\n      satStart: week.sat_start,\n      goal: week.calorie_goal,\n      proteinGoal: week.protein_goal,\n      history: this.buildHistory(),\n      status: 'synced',\n      draft: entries[s.idx]\n        ? { cal: entries[s.idx].cal ?? null, pro: entries[s.idx].pro ?? null, stop: entries[s.idx].stop ?? null, start: entries[s.idx].start ?? null }\n        : s.draft\n    }));\n  }\n\n  buildHistory() {\n    const out = [];\n    for (let w = 1; w <= 4; w++) {\n      const ws = addDays(this.weekStart, -7 * w);\n      const wRow = (this.weekRows || {})[iso(ws)];\n      const goal = wRow ? wRow.calorie_goal : 2400;\n      const rows = [], fasts = [];\n      for (let i = 0; i < 6; i++) {\n        const d = addDays(ws, i);\n        const r = (this.byDate || {})[iso(d)];\n        if (!r || r.calories == null) continue;\n        rows.push(r);\n        const carried = i === 0 ? (wRow ? wRow.sat_start : null) : ((this.byDate[iso(addDays(d, -1))] || {}).fast_start);\n        if (carried != null && r.fast_stop != null) fasts.push(((1440 - carried) + r.fast_stop) / 60);\n      }\n      if (!rows.length) continue;\n      const cal = avg(rows.map(r => r.calories));\n      const pro = avg(rows.map(r => r.protein).filter(v => v != null));\n      const fast = avg(fasts);\n      out.push({\n        label: pretty(ws),\n        goal: goal.toLocaleString(),\n        cal: Math.round(cal).toLocaleString(),\n        pro: pro == null ? '—' : Math.round(pro) + ' g',\n        fast: fast == null ? '—' : fast.toFixed(2),\n        days: rows.length + ' / 6',\n        color: cal <= goal ? GREEN : RED\n      });\n    }\n    return out;\n  }\n\n  async persistDay(i, entry) {\n    if (!this.sb) return;\n    this.setState({ status: 'saving' });\n    const day = iso(addDays(this.weekStart, i));\n    const row = { day, calories: entry.cal, protein: entry.pro, fast_stop: entry.stop, fast_start: entry.start, updated_at: new Date().toISOString() };\n    const { error } = await this.sb.from('days').upsert(row, { onConflict: 'day' });\n    if (error) { this.setState({ status: 'offline' }); return; }\n    if (this.byDate) this.byDate[day] = row;\n    this.setState({ status: 'synced' });\n  }\n\n  async persistWeek(patch) {\n    if (!this.sb) return;\n    this.setState({ status: 'saving' });\n    const wsISO = iso(this.weekStart);\n    const row = Object.assign({ week_start: wsISO }, (this.weekRows || {})[wsISO] || {}, patch);\n    const { error } = await this.sb.from('weeks').upsert(row, { onConflict: 'week_start' });\n    if (error) { this.setState({ status: 'offline' }); return; }\n    if (this.weekRows) this.weekRows[wsISO] = row;\n    this.setState({ status: 'synced' });\n  }\n\n  carried(i) {\n    if (i === 0) return this.state.satStart;\n    const prev = this.state.entries[i - 1];\n    return prev && prev.start != null ? prev.start : null;\n  }\n\n  hours(start, stop) {\n    if (start == null || stop == null) return null;\n    return ((1440 - start) + stop) / 60;\n  }\n\n  renderVals() {\n    const goal = this.state.goal ?? this.props.calorieGoal ?? 2400;\n    const proteinGoal = this.state.proteinGoal ?? this.props.proteinGoal ?? 190;\n    const { entries, idx, draft } = this.state;\n    const ws = this.weekStart || new Date();\n    const dates = [0,1,2,3,4,5].map(i => pretty(addDays(ws, i)));\n\n    const logged = Object.keys(entries).map(Number).filter(i => entries[i] && entries[i].cal != null).sort();\n    const n = logged.length;\n    const avgCal = avg(logged.map(i => entries[i].cal));\n    const avgPro = avg(logged.map(i => entries[i].pro).filter(v => v != null));\n    const avgFast = avg(logged.map(i => this.hours(this.carried(i), entries[i].stop)).filter(v => v != null));\n    const under = avgCal !== null && avgCal <= goal;\n    const avgColor = avgCal === null ? DIM : (under ? GREEN : RED);\n\n    const days = DAYS.map((name, i) => {\n      const e = entries[i];\n      const isToday = i === idx;\n      const h = e ? this.hours(this.carried(i), e.stop) : null;\n      return {\n        name: name.slice(0, 3).toUpperCase(),\n        date: dates[i],\n        nameColor: isToday ? ORANGE : '#f0ebe4',\n        border: isToday ? '#3d3830' : '#2e2a26',\n        bg: e ? '#1a1815' : 'transparent',\n        cal: e && e.cal != null ? e.cal.toLocaleString() : '—',\n        calNote: e && e.cal != null ? (e.cal <= goal ? 'under goal' : 'over goal') : 'not logged',\n        calColor: e && e.cal != null ? (e.cal <= goal ? '#fff' : RED) : DIM,\n        pro: e && e.pro != null ? e.pro + ' g' : '—',\n        fast: h != null ? h.toFixed(2) + ' h' : '—',\n        select: () => this.setState(s => ({\n          idx: i,\n          open: null,\n          saved: false,\n          draft: s.entries[i]\n            ? { cal: s.entries[i].cal ?? null, pro: s.entries[i].pro ?? null, stop: s.entries[i].stop ?? null, start: s.entries[i].start ?? null }\n            : { cal: null, pro: null, stop: null, start: null }\n        }))\n      };\n    });\n\n    const carriedIn = this.carried(idx);\n    const draftHours = this.hours(carriedIn, draft.stop);\n\n    const set = (k) => (ev) => {\n      const v = Number(ev.target.value);\n      const i = this.state.idx;\n      const next = Object.assign({ cal: null, pro: null, stop: null, start: null }, this.state.entries[i] || {}, { [k]: v });\n      this.setState(s => ({\n        draft: Object.assign({}, s.draft, { [k]: v }),\n        entries: Object.assign({}, s.entries, { [i]: next }),\n        saved: true\n      }));\n      this.persistDay(i, next);\n    };\n    const openField = (k, fallback) => () => this.setState(s => ({\n      open: k,\n      draft: s.draft[k] == null ? Object.assign({}, s.draft, { [k]: fallback }) : s.draft\n    }));\n    const shown = (v, fmt) => v == null ? '—' : fmt(v);\n\n    const remaining = [4, 5].filter(i => !logged.includes(i));\n    const sumCal = logged.reduce((a, i) => a + entries[i].cal, 0);\n    const need = remaining.length ? (goal * 6 - sumCal) / remaining.length : null;\n    const remainNames = remaining.map(i => DAYS[i].slice(0, 3)).join(' and ');\n\n    const statusText = { connecting: 'Connecting…', synced: 'Synced', saving: 'Saving…', offline: 'Offline — not saved' }[this.state.status];\n    const statusColor = { connecting: DIM, synced: GREEN, saving: ORANGE, offline: RED }[this.state.status];\n\n    return {\n      statusText, statusColor,\n      showPace: logged.includes(3) && remaining.length > 0,\n      paceTitle: 'To land the week at ' + goal.toLocaleString(),\n      paceValue: need == null ? '—' : (need <= 0 ? '0' : Math.floor(need).toLocaleString()),\n      paceUnit: 'kcal avg across ' + remainNames,\n      paceColor: need != null && need <= 1200 ? RED : ORANGE,\n\n      weekLabel: pretty(ws) + ', ' + ws.getFullYear(),\n      goalStr: goal.toLocaleString(),\n      proteinGoalStr: String(proteinGoal),\n      goalOpen: this.state.open === 'goal', goalShut: this.state.open !== 'goal',\n      pGoalOpen: this.state.open === 'pgoal', pGoalShut: this.state.open !== 'pgoal',\n      openGoal: () => this.setState({ open: 'goal' }),\n      openPGoal: () => this.setState({ open: 'pgoal' }),\n      draftGoal: String(goal),\n      draftPGoal: String(proteinGoal),\n      onGoal: (ev) => { const v = Number(ev.target.value); this.setState({ goal: v, open: null }); this.persistWeek({ calorie_goal: v }); },\n      onPGoal: (ev) => { const v = Number(ev.target.value); this.setState({ proteinGoal: v, open: null }); this.persistWeek({ protein_goal: v }); },\n\n      cardKicker: idx === new Date().getDay() ? 'Log today' : 'Log ' + DAYS[idx],\n      todayLabel: DAYS[idx] + ', ' + dates[idx],\n      todayStatus: entries[idx] ? 'Logged' : 'Not logged yet',\n      todayStatusColor: entries[idx] ? GREEN : DIM,\n\n      calOptions: range(1200, 6000, 25, v => v.toLocaleString()),\n      proOptions: range(60, 320, 5, v => v + ' g'),\n      startOptions: range(960, 1380, 15, clock),\n      stopOptions: range(360, 900, 15, clock),\n      goalOptions: range(1500, 4000, 25, v => v.toLocaleString()),\n      pGoalOptions: range(80, 320, 5, v => v + ' g'),\n      draftCal: String(draft.cal),\n      draftPro: String(draft.pro),\n      draftStart: String(draft.start),\n      draftStop: String(draft.stop),\n      onCal: set('cal'), onPro: set('pro'), onStart: set('start'), onStop: set('stop'),\n\n      calOpen: this.state.open === 'cal', calShut: this.state.open !== 'cal',\n      proOpen: this.state.open === 'pro', proShut: this.state.open !== 'pro',\n      stopOpen: this.state.open === 'stop', stopShut: this.state.open !== 'stop',\n      startOpen: this.state.open === 'start', startShut: this.state.open !== 'start',\n      openCal: openField('cal', goal), openPro: openField('pro', proteinGoal),\n      openStop: openField('stop', 660), openStart: openField('start', 1110),\n      calValue: shown(draft.cal, v => v.toLocaleString()),\n      proValue: shown(draft.pro, v => v + ' g'),\n      stopValue: shown(draft.stop, clock),\n      startValue: shown(draft.start, clock),\n      calValueColor: draft.cal == null ? DIM : '#f0ebe4',\n      proValueColor: draft.pro == null ? DIM : '#f0ebe4',\n      stopValueColor: draft.stop == null ? DIM : '#f0ebe4',\n      startValueColor: draft.start == null ? DIM : '#f0ebe4',\n      carriedStart: carriedIn == null ? 'set time' : clock(carriedIn),\n      carriedColor: carriedIn == null ? DIM : '#f0ebe4',\n      carriedFixed: idx !== 0,\n      satOpen: idx === 0 && this.state.open === 'sat',\n      satShut: idx === 0 && this.state.open !== 'sat',\n      draftSat: String(this.state.satStart == null ? 1110 : this.state.satStart),\n      openSat: () => this.setState({ open: 'sat' }),\n      onSat: (ev) => { const v = Number(ev.target.value); this.setState({ satStart: v, open: null, saved: false }); this.persistWeek({ sat_start: v }); },\n\n      draftHours: draftHours == null ? '—' : draftHours.toFixed(2),\n      draftProPct: (draft.cal == null || draft.pro == null || draft.cal === 0)\n        ? '—' : Math.round((draft.pro * 4 / draft.cal) * 100) + '%',\n      saveLabel: this.state.saved ? 'Saved ✓' : 'Save what\\u2019s entered',\n      onSave: () => {\n        const prior = entries[idx] || {};\n        const next = {\n          cal: draft.cal != null ? draft.cal : (prior.cal ?? null),\n          pro: draft.pro != null ? draft.pro : (prior.pro ?? null),\n          stop: draft.stop != null ? draft.stop : (prior.stop ?? null),\n          start: draft.start != null ? draft.start : (prior.start ?? null)\n        };\n        if (next.cal == null && next.pro == null && next.stop == null && next.start == null) { this.setState({ open: 'cal' }); return; }\n        this.setState(s => ({ entries: Object.assign({}, s.entries, { [idx]: next }), saved: true, open: null }));\n        this.persistDay(idx, next);\n      },\n\n      avgCalStr: avgCal === null ? '—' : Math.round(avgCal).toLocaleString(),\n      avgColor,\n      avgPct: avgCal === null ? '0%' : Math.min(100, (avgCal / goal) * 100).toFixed(1) + '%',\n      avgVerdict: avgCal === null\n        ? 'Nothing logged yet this week.'\n        : (under\n            ? Math.round(goal - avgCal).toLocaleString() + ' under goal across ' + n + (n === 1 ? ' logged day' : ' logged days')\n            : Math.round(avgCal - goal).toLocaleString() + ' over goal across ' + n + (n === 1 ? ' logged day' : ' logged days')),\n      avgProStr: avgPro === null ? '—' : Math.round(avgPro) + ' g',\n      proColor: avgPro === null ? DIM : (avgPro >= proteinGoal ? GREEN : RED),\n      proDelta: avgPro === null ? '' : (avgPro >= proteinGoal ? '+' : '−') + Math.abs(Math.round(avgPro - proteinGoal)) + ' g vs goal',\n      avgFastStr: avgFast === null ? '—' : avgFast.toFixed(2),\n      loggedStr: n + ' / 6',\n      days,\n      history: this.state.history,\n      hasHistory: this.state.history.length > 0\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
